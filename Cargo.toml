[package]
name = "bera-reth-exex-template"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
resolver = "2"
rust-version = "1.88.0"

[dependencies]
bera-reth = { git = "https://github.com/berachain/bera-reth", tag = "v1.1.0" }

# Additional utilities - let bera-reth control alloy versions
# alloy crates will be resolved through bera-reth dependency
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-cli-commands = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v1.7.0" }

# Async and utilities
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
tracing = "0.1.41"

# Pin serde to working version to avoid known alloy-consensus deserialize issue
# See: https://github.com/alloy-rs/alloy/issues/1349
serde = { version = "=1.0.219" }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["reth/asm-keccak"]
min-debug-logs = ["reth/min-debug-logs"]
client = []

[dependencies.tikv-jemallocator]
version = "0.6.0"
optional = true

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[[bin]]
name = "bera-reth"
path = "src/main.rs"
